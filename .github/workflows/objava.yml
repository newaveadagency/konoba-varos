# Automatska objava na GitHub Pages nakon svake promjene (uređivač, dashboard ili git push).
# Repo varijabla PREVIEW (Settings → Secrets and variables → Actions → Variables):
#   1 ili prazno = probna objava (noindex + gumb za demo uređivač), 0 = javna stranica
name: Objava
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: objava
  cancel-in-progress: true
jobs:
  objava:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Izgradnja stranice
        env:
          PREVIEW: ${{ vars.PREVIEW || '1' }}
        run: python3 objava.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
